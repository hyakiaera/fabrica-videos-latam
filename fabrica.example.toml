# ============================================================
#  PERILLAS DE LA FÁBRICA DE VIDEOS
#  Copia este archivo como fabrica.toml y cambia lo que quieras.
#  Las CLAVES (Gemini, Groq, Pexels...) NO van aquí: van en .env
#  (en tu PC) o en Secrets (en GitHub).
# ============================================================

[fabrica]
videos_por_ronda = 2
# "auto" = la IA elige el estilo según el tema. O fija uno:
# explicativo, caricatura, comic, artistico, acuarela, pizarra, anime,
# 3d, cinematografico, noticiero, realista
estilo = "auto"
# Combina las que quieras: "descargar" (siempre activa), "drive", "publicar"
salidas = ["descargar", "drive"]

[mezcla]
# Porcentaje de cada tipo de tema en los videos automáticos (deben sumar 100).
activa = true
general = 20          # lo que está en tendencia (el sistema de siempre)
deportes = 17         # Liga MX, fútbol salvadoreño, LaLiga, MLS, Premier, selecciones, Messi, CR7, béisbol
mundo = 9            # tendencias y noticias no latinas
entretenimiento = 18  # novelas, series, moda, maquillaje, temas de mujeres y hombres (latinos)
curiosidades = 18     # cómo hacer, sabías que, consejos, motivación, ideas de negocio, tops
finanzas = 10         # cripto, bolsa, Wall Street, memecoins, apps para invertir
musica = 8            # música latina/urbana, top 5, El Hyako Mayor, Hyakiaera Records, estudio, VST, Suno

# segun_vistas: con YOUTUBE_API_KEY y YOUTUBE_CANAL, la mezcla se inclina hacia lo que más vistas tiene
segun_vistas = true

[tendencias]
categorias = ["deportes", "entretenimiento", "tecnologia", "economia", "mundo", "ciencia"]
titulares_por_categoria = 8
max_candidatos_ia = 90

# Google Trends por país y su peso (más alto = más prioridad)
[tendencias.trends_paises]
MX = 1.0
CO = 1.0
AR = 0.95
PE = 0.85
CL = 0.85
US = 0.7   # EE.UU. en inglés: lo viral que también llega a latinos
ES = 0.6

# Ediciones de Google News (español latino, latinos en EE.UU. e inglés)
[[tendencias.news_ediciones]]
hl = "es-419"
gl = "MX"
ceid = "MX:es-419"
peso = 1.0

[[tendencias.news_ediciones]]
hl = "es-419"
gl = "US"
ceid = "US:es-419"
peso = 0.95

[[tendencias.news_ediciones]]
hl = "en-US"
gl = "US"
ceid = "US:en"
peso = 0.7

[ia]
# Si un modelo deja de existir, la fábrica prueba otros solos.
modelo_gemini = "gemini-flash-latest"
modelo_groq = "openai/gpt-oss-120b"
usar_pollinations_texto = true   # tercer respaldo gratis, sin clave

[guion]
duracion_segundos = 55
segundos_por_escena = 4
instrucciones_extra = "Al final invita a seguir el canal."

[imagenes]
modelo_pollinations = "flux"
url_pollinations = "https://image.pollinations.ai/prompt/"
simultaneas = 3             # imágenes que se piden a la vez (más = más rápido)
revisar = true              # Gemini revisa cada imagen y rehace la que no encaja con el guion
clips = true                # clips de video reales (Pixabay/Pexels) en realista, noticiero y cinematográfico
clips_proporcion = 0.4      # más o menos qué parte de las escenas lleva clip
estilizar_fotos = false     # true = pasar fotos reales al estilo dibujado (puede deformar caras)
guardar_generadas = true    # las imágenes IA van a "mis fotos/generadas/<categoría>" para reusarlas
fotos_web = true            # fotos reales de las noticias (RSS) y de Openverse
max_fotos_propias = 40      # fotos de "mis fotos" que se consideran por categoría
max_imagenes = 14           # imágenes nuevas por video (cuida la cuota diaria gratis);
                            # las demás escenas reutilizan una con otro movimiento
modelo_revision = "gemini-flash-lite-latest"

[voz]
# "hombre" o "mujer". Voces gratis de Edge en español latino neutro (México,
# el acento más neutro para Latinoamérica; se usa en el doblaje).
genero = "hombre"
voz_hombre = "es-MX-JorgeNeural-Male"
voz_mujer = "es-MX-DaliaNeural-Female"
# Otras opciones: es-US-AlonsoNeural-Male, es-US-PalomaNeural-Female
velocidad = 1.1
# Si Edge falla, se prueban otras voces y al final la voz gratis de Google.
modelo_whisper = "small"    # subtítulos cuando se usa un audio propio o de respaldo

# PERILLA DE VOZ CLONADA: convierte la voz de Edge a TU voz con el modelo que
# entrenaste en tu cuaderno StudioVoz (Colab). Lo toma solo de tu Drive:
# Mi unidad › StudioVoz › modelos › <modelo> › respaldo
clonar = false
motor = "applio"            # "applio" (StudioVoz) o "comando" (otro programa)
modelo = "mi_voz"           # el NOMBRE_MODELO que usaste en StudioVoz
carpeta_modelos_drive = "StudioVoz/modelos"
tono = 0                    # +12 hombre→mujer, -12 mujer→hombre
parecido = 0.75             # PARECIDO_A_LA_VOZ del cuaderno (más alto = más parecido a ti)
proteger_consonantes = 0.33
metodo_tono = "rmvpe"
tiempo_max_clonar = 1800
# Voz "yo" (IA lectora que imita tus grabaciones de la carpeta "mi voz")
yo_oraciones_por_pedazo = 3  # 1 = como antes (oración por oración)
yo_ritmo = 0.4               # más bajo = más pausado
yo_expresion = 0.5           # más alto = más emoción
yo_pulir = true              # pasar por tu modelo (HYAKO_LOCUTOR) al final
yo_limpiar = true            # quitar soplido/zumbido de los silencios entre frases
yo_umbral_silencio = "-38dB" # más alto (ej. -32dB) = silencios más limpios; muy alto corta finales de palabra
# Solo si motor = "comando": recibe {entrada} y debe crear {salida}
comando_clonar = ""

[video]
aspecto = "9:16"            # 9:16, 16:9 o 1:1
musica = "random"           # "random" o "" para sin música
volumen_musica = 0.15
tamano_letra = 70
grosor_borde = 2.5
posicion_subtitulos = "custom"
altura_subtitulos = 72      # % desde arriba
transicion = ""             # las escenas ya traen cortes dinámicos (golpe de zoom)
fuente_stock = "pexels"     # para el estilo "realista"
duracion_clip_stock = 4
descargas_simultaneas_stock = 2  # más alto = Pixabay/Pexels pueden bloquear (error 429)
hilos = 4                   # GitHub da 4 núcleos

[logo]
activo = true
archivo = "marca/logo.png"  # sube tu PNG con fondo transparente con este nombre
# Si no hay logo.png, se usa este texto como logo (ej. "@MiCanal"). Vacío = sin logo.
texto = "DESVERGUEOFFICIAL"
tamano_texto = 0.34         # ancho del texto de marca (fracción del video)
# Posiciones listas (fuera de subtítulos y botones de las apps):
# arriba_izquierda, arriba_centro, arriba_derecha, centro_izquierda,
# abajo_izquierda, o "personalizada" usando x / y
posicion = "centro_izquierda"
x = 4                       # % desde la izquierda (solo personalizada)
y = 7                       # % desde arriba (solo personalizada)
tamano = 0.16               # fracción del ancho del video (0.16 = 16 %)
opacidad = 0.9              # 1 = sólido, 0.5 = medio transparente
# Para ver cómo queda sin hacer un video: python -m fabrica --probar-logo

[avatar]
# Tu avatar (tus videos reales con la boca moviéndose), hecho en Kaggle.
# Modos: "no", "intro y cierre", "esquina", "dividida", "mixto"
modo = "no"
carpeta_videos_id = "1ypNm-QUX-AJ7bhPd27xK_MAgly60Z-MF"  # tu carpeta EL HYAKO 1 en Drive
intro_segundos = 5
cierre_segundos = 5
espera_max_segundos = 5400

[musica]
por_tono = true     # usar tus canciones de Drive "Fabrica de Videos/musica/<ánimo>" según el tono
carpeta = "musica"

[animar]
# Escenas que se mueven de verdad (LTX-Video en Kaggle). Tarda 10-25 min por video y gasta
# minutos de GitHub mientras espera, por eso viene apagado. Se prende con la variable ANIMAR = si.
activo = false
escenas = 3
pasos = 30
espera_max_segundos = 4500

[miniatura]
activa = true       # portada con texto grande y tu cara si hay avatar
color_1 = "#FFE600"
color_2 = "#FFFFFF"

[efectos]
activos = false     # "whoosh" en cada cambio de escena (o variable EFECTOS = si)
volumen = 0.15

[firma]
# Autor que aparece en los datos del archivo de video (propiedades / metadatos).
autor = "DESVERGUEOFFICIAL"
# copyright = "© 2026 DESVERGUEOFFICIAL"
# comentario = "Video de DESVERGUEOFFICIAL"

[salida]
carpeta = "salida"          # aquí quedan los videos para descargar

[drive]
remoto = "drive"            # nombre del remoto de rclone
carpeta = "Fabrica de Videos"
carpeta_fotos = "mis fotos"  # dentro de la carpeta anterior, una subcarpeta por categoría

[publicar]
# Usa Upload-Post (integración que ya trae MoneyPrinterTurbo).
plataformas = ["youtube", "facebook", "x"]   # las que tienes conectadas en Upload-Post
