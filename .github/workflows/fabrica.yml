name: Fabrica de videos

on:
  schedule:
    # Hora de México (UTC-6). 1 video por ronda.
    # Lunes a viernes: 7am, 12pm, 4pm y 10pm (4 videos)
    # Sábado y domingo: 7am, 11am, 3pm, 7pm y 10pm (5 videos)
    - cron: "5 13 * * *"      # 7am todos los días
    - cron: "5 4 * * *"       # 10pm todos los días (en UTC ya es el día siguiente)
    - cron: "5 18 * * 1-5"    # 12pm lunes a viernes
    - cron: "5 22 * * 1-5"    # 4pm lunes a viernes
    - cron: "5 17 * * 0,6"    # 11am sábado y domingo
    - cron: "5 21 * * 0,6"    # 3pm sábado y domingo
    - cron: "5 1 * * 0,1"     # 7pm sábado y domingo (en UTC ya es domingo y lunes)
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cuántos videos"
        default: "1"
      estilo:
        description: "Estilo"
        type: choice
        default: auto
        options: [auto, explicativo, caricatura, comic, artistico, acuarela, pizarra, anime, 3d, cinematografico, noticiero, realista, videos_stock]
      tema:
        description: "Tema, pedido o link de YouTube/TikTok/noticia (vacío = tendencias)"
        default: ""
      duracion:
        description: "Duración del video (minutos)"
        type: choice
        default: "1"
        options: ["1", "1:30", "2", "2:30", "3"]
      logo:
        description: "Logo: link de tu PNG (Drive compartido) o un texto como @MiCanal"
        default: ""
      posicion_logo:
        description: "Posición del logo"
        type: choice
        default: arriba_izquierda
        options: [arriba_izquierda, arriba_centro, arriba_derecha, centro_izquierda, abajo_izquierda]
      voz:
        description: "Voz"
        type: choice
        default: hombre
        options: [hombre, mujer, mi voz, yo, yo sin modelo]
      modelo_voz_link:
        description: "Para 'mi voz': link del modelo (.pth/.zip) o su nombre en StudioVoz (vacío = mi_voz)"
        default: ""
      avatar:
        description: "Tu avatar (hecho en Kaggle)"
        type: choice
        default: "no"
        options: ["no", "intro y cierre", "esquina", "dividida", "mixto"]
      detalles:
        description: "Detalles que SÍ tienen que salir o decirse (ej. el top 10 en orden, precios, fecha)"
        default: ""

permissions:
  contents: write  # para guardar el historial de temas y no repetirlos

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 170  # el avatar en Kaggle puede tardar
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          pip install -q -r requirements.txt
          pip install -q -U yt-dlp trafilatura gdown edge-tts num2words kaggle
          pip install -q --no-deps gTTS  # voz de respaldo (sin cambiar otras librerías)

      - name: Recordar el motor de voz clonada (StudioVoz/Applio)
        uses: actions/cache@v4
        with:
          path: |
            .applio
            .applio_modelos
            .chatterbox
            ~/.cache/huggingface
          key: voces-${{ runner.os }}-v2

      - name: Configurar Google Drive (rclone)
        env:
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN || secrets.RCLONE }}
        run: |
          if [ -z "$RCLONE_DRIVE_TOKEN" ]; then echo "Sin RCLONE_DRIVE_TOKEN: no se subirá a Drive"; exit 0; fi
          mkdir -p ~/.config/rclone
          # Acepta el token como JSON ({"access_token"...}) o en el formato nuevo
          # de "rclone authorize" (texto largo que empieza con eyJ...).
          TOKEN=$(python3 -c '
          import base64, json, os
          t = os.environ["RCLONE_DRIVE_TOKEN"].strip()
          t = t.split("--->")[-1].split("<---")[0].strip()
          if not t.startswith("{"):
              t = json.loads(base64.b64decode(t + "=" * (-len(t) % 4)).decode())["token"]
          print(json.dumps(json.loads(t)))
          ') || { echo "::warning::RCLONE_DRIVE_TOKEN no tiene el formato correcto (copia todo, de { a })"; exit 0; }
          printf '[drive]\ntype = drive\nscope = drive\ntoken = %s\n' "$TOKEN" > ~/.config/rclone/rclone.conf
          if rclone lsd drive: --max-depth 1 > /dev/null; then
            echo "Google Drive conectado"
          else
            echo "::warning::No se pudo entrar a Google Drive: revisa el secreto RCLONE_DRIVE_TOKEN. Los videos quedan para descargar."
          fi

      - name: Hacer videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USERNAME: ${{ secrets.UPLOAD_POST_USERNAME }}
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_CANTIDAD: ${{ inputs.cantidad || '1' }}
          IN_ESTILO: ${{ inputs.estilo || 'auto' }}
          IN_TEMA: ${{ inputs.tema }}
          IN_DURACION: ${{ inputs.duracion || vars.DURACION || '1' }}
          IN_LOGO: ${{ inputs.logo || vars.LOGO_LINK || vars.TEXTO_MARCA }}
          IN_POSICION_LOGO: ${{ inputs.posicion_logo || vars.LOGO_POSICION }}
          # Con tu modelo guardado (secreto MI_VOS), las rondas automáticas usan "yo": la IA lectora
          # aprende de tus muestras (carpeta "mi voz") y HYAKO_LOCUTOR le pone tu timbre.
          # Si algo falla, sale la voz normal.
          IN_VOZ: ${{ inputs.voz || vars.VOZ || ((secrets.MI_VOS || secrets.MODELO_VOZ_LINK || vars.MODELO_VOZ_LINK) && 'yo') || 'hombre' }}
          IN_MODELO_LINK: ${{ inputs.modelo_voz_link || vars.MODELO_VOZ_LINK || secrets.MODELO_VOZ_LINK || secrets.MI_VOS }}
          IN_MODELO_ESCRITO: ${{ inputs.modelo_voz_link }}
          IN_AVATAR: ${{ inputs.avatar || vars.AVATAR || 'no' }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          IN_DETALLES: ${{ inputs.detalles }}
          VAR_PUBLICAR: ${{ vars.PUBLICAR }}
          ANIMAR: ${{ vars.ANIMAR }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CANAL: ${{ vars.YOUTUBE_CANAL }}
        run: |
          cp config.example.toml config.toml
          MARCA=()
          case "$IN_LOGO" in
            http*) MARCA+=(--logo-link "$IN_LOGO") ;;
            "") ;;
            *) MARCA+=(--texto-marca "$IN_LOGO") ;;
          esac
          if [ -n "$IN_POSICION_LOGO" ]; then MARCA+=(--posicion-logo "$IN_POSICION_LOGO"); fi
          # Escribir "probar logo" en Tema crea solo la imagen de prueba del logo.
          if [ "$(echo "$IN_TEMA" | tr '[:upper:]' '[:lower:]' | xargs)" = "probar logo" ]; then
            python -m fabrica --probar-logo "${MARCA[@]}"; exit 0
          fi

          SALIDAS="descargar"
          SALIDAS="$SALIDAS,drive"
          # PUBLICAR = si (todos) | manual (solo los que pides con Run workflow)
          #          | mejor (1 al día: el automático con mejor nota, en la ronda de las 10pm)
          #          | mejor,manual (las dos cosas) | vacío (ninguno)
          PUB="$(echo "$VAR_PUBLICAR" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [ "$PUB" = "si" ]; then SALIDAS="$SALIDAS,publicar"; fi
          if [[ ",$PUB," == *,manual,* ]] && [ "$EVENTO" = "workflow_dispatch" ]; then SALIDAS="$SALIDAS,publicar"; fi
          ARGS=(--salidas "$SALIDAS" --cantidad "$IN_CANTIDAD" --estilo "$IN_ESTILO" --duracion "$IN_DURACION" --avatar "$IN_AVATAR")
          # La ronda de las 10pm (la última del día) publica el mejor de las últimas 24 horas.
          if [[ ",$PUB," == *,mejor,* ]] && [ "$CRON" = "5 4 * * *" ]; then ARGS+=(--publicar-mejor); fi
          if [ -n "$IN_TEMA" ]; then ARGS+=(--tema "$IN_TEMA"); fi
          if [ -n "$IN_DETALLES" ]; then ARGS+=(--detalles "$IN_DETALLES"); fi
          # Si pegaste el link de tu modelo en el formulario, se usa tu voz aunque la casilla diga hombre.
          if [ -n "$IN_MODELO_ESCRITO" ] && [ "${IN_VOZ#yo}" = "$IN_VOZ" ]; then IN_VOZ="mi voz"; fi
          if [ "$IN_VOZ" = "yo sin modelo" ]; then
            ARGS+=(--voz yo-sin-modelo --clonar-voz no)
          elif [ "$IN_VOZ" = "yo" ]; then
            # Una IA lee imitando tus grabaciones (Drive: Fabrica de Videos/mi voz) y tu modelo la pule.
            ARGS+=(--voz yo --clonar-voz no)
            if [ -n "$IN_MODELO_LINK" ]; then ARGS+=(--modelo-voz-link "$IN_MODELO_LINK"); fi
          elif [ "$IN_VOZ" = "mi voz" ]; then
            ARGS+=(--clonar-voz si)
            if [ -n "$IN_MODELO_LINK" ]; then ARGS+=(--modelo-voz-link "$IN_MODELO_LINK"); fi
          else
            ARGS+=(--voz "$IN_VOZ" --clonar-voz no)
          fi
          python -m fabrica "${ARGS[@]}" "${MARCA[@]}"

      - name: Dejar los videos para descargar
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: videos-${{ github.run_number }}
          path: salida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar historial de temas
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add estado/historial.json estado/avatares.json estado/rendimiento.json 2>/dev/null || git add estado/historial.json estado/avatares.json 2>/dev/null || git add estado/historial.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Historial de temas"
          # Si mientras tanto se subió otro cambio, se junta y se reintenta.
          for intento in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep $((intento * 5))
          done
          echo "::warning::No se pudo guardar el historial (el video sí se hizo)"
